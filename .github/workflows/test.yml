name: Tests

# Engine tests (tests/engine.test.ts, against a real account snapshot), the meta-cluster tests,
# typecheck and lint on every push and pull request, so an engine change can't quietly break the
# recommendation rules. The twice-monthly data refresh pushes with GITHUB_TOKEN, which doesn't
# trigger this workflow, so refreshed data is checked by the next code push instead.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
