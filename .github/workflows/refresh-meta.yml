name: Refresh card + meta data

# Keeps the bundled game data current on its own. Runs WEEKLY (not just monthly) so mid-season
# changes — a Royale Pass evolution/hero the API publishes mid-month, a balance-driven meta shift —
# land in the bundled data and global meta within days instead of waiting for the next season.
# Pulls the latest cards and top-1000 meta decks and commits any changes; the push triggers a Vercel
# production deploy automatically, so the live site tracks the current game with no manual step.
# (Live per-player sync already surfaces new forms the day the API gets them; this keeps the shared
# card master data + meta decks in step too.)
on:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the refreshed data back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The refresh scripts use only Node built-ins + global fetch — no npm install needed.
      - name: Refresh cards (adds newly released cards)
        run: node scripts/refresh-cards.mjs
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}

      - name: Refresh meta decks (current top-1000 ladder decks)
        run: node scripts/refresh-meta.mjs
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes — meta and cards already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # No [skip ci]: Vercel honors it and would skip deploying the refreshed data. This
          # workflow only runs on schedule/dispatch (never on push), so the push can't loop.
          git commit -m "chore: monthly card + meta data refresh"
          git push
